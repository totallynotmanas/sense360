version: '3.8'
services:
  mytb:
    restart: always
    image: "thingsboard/tb-postgres"
    ports:
      - "8080:9090" # Web UI
      - "1883:1883" # MQTT
      - "5683:5683/udp" # CoAP
    environment:
      TB_QUEUE_TYPE: in-memory
    volumes:
      - ./mytb-data:/data
      - ./mytb-logs:/var/log/thingsboard
  ml_module:
    build: ./ml_module
    ports:
      - "5000:5000"
